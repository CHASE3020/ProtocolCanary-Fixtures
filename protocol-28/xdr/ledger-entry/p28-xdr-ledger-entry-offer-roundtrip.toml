# Protocol 28 / LedgerEntry: the OFFER arm round-trips.
#
# What this tests:
# A `LedgerEntry` with the OFFER arm: an `OfferEntry` selling the native asset
# for a credit_alphanum4 `USDC`, offer id 42, amount 1000, price 3/2.
#
# Why it matters: the pack covered the Account, Trustline, ContractData,
# ContractCode and TTL arms but not Offer, which carries two Asset unions and
# a Price in one struct. The seller, issuer and offer are synthetic: this does
# not claim the offer exists on any network.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `struct LedgerEntry` — Stellar-ledger-entries.x lines 548-586;
#   * `enum LedgerEntryType` (OFFER = 2, DATA = 3) — Stellar-ledger-entries.x lines 92-104;
#   * `struct OfferEntry` — Stellar-ledger-entries.x lines 326-349;
#   * `struct Price` — Stellar-ledger-entries.x lines 70-74;
#   * `union Asset` — Stellar-ledger-entries.x lines 55-66.
#
# Expected result and where it comes from: kind = "roundtrip" means a
# decoder must accept this value and re-encoding it must reproduce
# value_base64 byte for byte, not merely an equal value. The payload was
# produced by a program that builds the typed value with the official `stellar-xdr 28.0.1` crate (features base64, alloc and std — the
# crate version Protocol-Canary's canary-xdr pins for Protocol 28; rustc 1.97.1
# (8bab26f4f 2026-07-14)) on 2026-11-20 (UTC)
# and serialises it with to_xdr(Limits::none()), never hand-assembled.
# Generation expression, recorded verbatim:
#
#   LedgerEntry {
#       last_modified_ledger_seq: 7,
#       data: LedgerEntryData::Offer(OfferEntry {
#           seller_id: AccountId(PublicKey::PublicKeyTypeEd25519(Uint256([0x11; 32]))),
#           offer_id: 42,
#           selling: Asset::Native,
#           buying: Asset::CreditAlphanum4(AlphaNum4 {
#               asset_code: AssetCode4(*b"USDC"),
#               issuer: AccountId(PublicKey::PublicKeyTypeEd25519(Uint256([0x22; 32]))),
#           }),
#           amount: 1_000,
#           price: Price { n: 3, d: 2 },
#           flags: 0,
#           ext: OfferEntryExt::V0,
#       }),
#       ext: LedgerEntryExt::V0,
#   }
#
# The same program asserted the crate's own round trip: from_xdr returned
# Ok, the decoded value equals the built one, and re-encoding it reproduced
# the encoding exactly.
#
# Is it deterministic: Yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes.
#
# Every byte is a synthetic structural value, not a capture of a real network
# object: no real account key, contract id, signature or secret key appears,
# and nothing here was observed on a network or accepted by a host.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-ledger-entries.x

