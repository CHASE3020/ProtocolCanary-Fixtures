# Protocol 28 / CAP-0085: an external-reference tag of three bytes (one pad byte) round-trips.
#
# What this tests:
# A CAP-0085 `ContractExecutable::ExternalRef` whose `tag` is the three-byte
# string `v28`: a length prefix of 3, the payload, and one zero pad byte.
# `executable_owner` is ScAddress::Contract with the placeholder 32-byte hash
# 0x55 repeated, not a deployed contract.
#
# Why it matters: the existing CAP-0085 roundtrip uses an eight-byte tag,
# which needs no padding at all; this one makes the tag carry one pad byte.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `struct ContractExecutableExternalRef` — Stellar-contract.x lines 224-227;
#   * `union ContractExecutable` (case CONTRACT_EXECUTABLE_EXTERNAL_REF, discriminant 2) — Stellar-contract.x;
#   * `typedef string SCString<>;` — Stellar-contract.x line 10.
#
# Expected result and where it comes from: kind = "roundtrip" means a
# decoder must accept this value and re-encoding it must reproduce
# value_base64 byte for byte, not merely an equal value. The payload was
# produced by a program that builds the typed value with the official `stellar-xdr 28.0.1` crate (features base64, alloc and std — the
# crate version Protocol-Canary's canary-xdr pins for Protocol 28; rustc 1.97.1
# (8bab26f4f 2026-07-14)) on 2026-11-20 (UTC)
# and serialises it with to_xdr(Limits::none()), never hand-assembled.
# Generation expression, recorded verbatim:
#
#   ContractExecutable::ExternalRef(ContractExecutableExternalRef {
#       executable_owner: ScAddress::Contract(ContractId(Hash([0x55; 32]))),
#       tag: ScString::try_from(b"v28".to_vec()).unwrap(),
#   })
#
# The same program asserted the crate's own round trip: from_xdr returned
# Ok, the decoded value equals the built one, and re-encoding it reproduced
# the encoding exactly.
#
# Is it deterministic: Yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes.
#
# Every byte is a synthetic structural value, not a capture of a real network
# object: no real account key, contract id, signature or secret key appears,
# and nothing here was observed on a network or accepted by a host.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x

id = "p28-xdr-cap85-external-ref-tag-three-byte-roundtrip"
protocol = 28
surface = "xdr"
category = "cap-0085"
description = "A CAP-0085 ContractExecutable external reference with a three-byte tag round-trips byte-for-byte"
source_reference = "https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-contract.x"

type = "ContractExecutable"
kind = "roundtrip"
value_base64 = "AAAAAgAAAAFVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVVQAAAAN2MjgA"
