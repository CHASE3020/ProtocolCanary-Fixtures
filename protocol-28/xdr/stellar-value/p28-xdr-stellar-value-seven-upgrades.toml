# Protocol 28 / StellarValue: an `upgrades` vector one item above its bound.
#
# What this tests: a decoder must reject an `upgrades` count of 7, one above
# `UpgradeType upgrades<6>`.
#
# Malformation rule (documented, deterministic, a single count mutation):
# start from the crate-produced encoding in
# p28-xdr-stellar-value-six-upgrades-boundary.toml. Replace the count word at
# byte offset 40 (0x00000006) with 0x00000007, and append a seventh
# well-formed item (length 1, data 0xb7, three zero padding bytes) before the
# unchanged STELLAR_VALUE_BASIC ext discriminant. Every item is within the
# 128-byte item bound. The only defect is the item count.
#
# Definitions (stellar/stellar-xdr tag v28.0, commit
# 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694): `struct StellarValue` in
# Stellar-ledger.x declares `UpgradeType upgrades<6>`, and Stellar-types.x
# declares `typedef opaque UpgradeType<128>`. So the vector holds at most six
# items and each item holds at most 128 opaque bytes.
#
# Structural XDR test only: the opaque upgrade bytes are arbitrary sentinels.
# They do not encode a real LedgerUpgrade and do not describe a
# protocol-valid ledger upgrade.
#
# Definitions: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-ledger.x
#              https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-types.x
#
# Expected result: kind = "decode-failure". Checked with the official
# `stellar-xdr` 28.0.1 crate: StellarValue::from_xdr_base64(.., Limits::none())
# returns Err(LengthExceedsMax), while the unmodified six-item source value
# decodes and round-trips. The independent codec in tests/xdr_codec.py also
# rejects it.
#
# Crate: official `stellar-xdr` 28.0.1 (features base64, alloc, std — the
# crate version Protocol-Canary's canary-xdr pins for Protocol 28);
# rustc 1.97.1 (8bab26f4f 2026-07-14); generated 2026-11-20 (UTC).
#
# Every byte is a synthetic structural value, not a capture of a real
# network object. Nothing here was observed on a network.

