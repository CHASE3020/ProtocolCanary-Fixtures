# Protocol 28 / TransactionEnvelope: a Payment with a muxed per-operation source round-trips.
#
# What this tests:
# An ENVELOPE_TYPE_TX envelope whose single Payment operation sets
# `Operation.sourceAccount` (present flag 1) to a `MuxedAccount` of type
# KEY_TYPE_MUXED_ED25519 (0x100) with id 0x0102030405060708.
#
# Why it matters: every other envelope fixture in the pack uses classic
# Ed25519 accounts and leaves the operation source absent, so neither the
# muxed arm nor the per-operation override was exercised. The envelope is
# structural and unsigned (zero signatures); the keys are placeholders.
#
# Definitions (stellar/stellar-xdr at tag v28.0, commit 9c9c145953e80990d6ff1ae3a6a973a0ce6d0694):
#
#   * `union TransactionEnvelope` — Stellar-transaction.x lines 1001-1010;
#   * `struct Operation` (`MuxedAccount* sourceAccount;` at line 659) — Stellar-transaction.x lines 653-719;
#   * `union MuxedAccount` — Stellar-transaction.x lines 20-31;
#   * `struct PaymentOp` — Stellar-transaction.x lines 92-97;
#   * `enum CryptoKeyType` (KEY_TYPE_MUXED_ED25519 = 0x100) — Stellar-types.x lines 29-38.
#
# Expected result and where it comes from: kind = "roundtrip" means a
# decoder must accept this value and re-encoding it must reproduce
# value_base64 byte for byte, not merely an equal value. The payload was
# produced by a program that builds the typed value with the official `stellar-xdr 28.0.1` crate (features base64, alloc and std — the
# crate version Protocol-Canary's canary-xdr pins for Protocol 28; rustc 1.97.1
# (8bab26f4f 2026-07-14)) on 2026-11-20 (UTC)
# and serialises it with to_xdr(Limits::none()), never hand-assembled.
# Generation expression, recorded verbatim:
#
#   TransactionEnvelope::Tx(TransactionV1Envelope {
#       tx: Transaction {
#           source_account: MuxedAccount::Ed25519(Uint256([0x11; 32])),
#           fee: 100,
#           seq_num: SequenceNumber(1),
#           cond: Preconditions::None,
#           memo: Memo::None,
#           operations: vec![Operation {
#               source_account: Some(MuxedAccount::MuxedEd25519(MuxedAccountMed25519 {
#                   id: 0x0102_0304_0506_0708,
#                   ed25519: Uint256([0x33; 32]),
#               })),
#               body: OperationBody::Payment(PaymentOp {
#                   destination: MuxedAccount::Ed25519(Uint256([0x22; 32])),
#                   asset: Asset::Native,
#                   amount: 10_000_000,
#               }),
#           }].try_into().unwrap(),
#           ext: TransactionExt::V0,
#       },
#       signatures: VecM::default(),
#   })
#
# The same program asserted the crate's own round trip: from_xdr returned
# Ok, the decoded value equals the built one, and re-encoding it reproduced
# the encoding exactly.
#
# Is it deterministic: Yes. The generator uses no randomness, clock or
# network; the same expression always yields the same bytes.
#
# Every byte is a synthetic structural value, not a capture of a real network
# object: no real account key, contract id, signature or secret key appears,
# and nothing here was observed on a network or accepted by a host.
#
# Definition: https://github.com/stellar/stellar-xdr/blob/9c9c145953e80990d6ff1ae3a6a973a0ce6d0694/Stellar-transaction.x

